<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyForAgents - AI Platform for Real Estate Professionals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .status {
            background: rgba(255,255,255,0.2);
            padding: 1.5rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }
        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔑🏡</div>
        <h1>KeyForAgents</h1>
        <p class="subtitle">AI Platform for Real Estate Professionals</p>
        <div class="status">
            <h2>🎉 We're Live!</h2>
            <p style="margin-top: 1rem;">Your domain is successfully configured and deployed.</p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.8;">keyforagents.com</p>
        </div>
    </div>
</body>
</html>
